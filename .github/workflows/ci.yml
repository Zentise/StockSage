name: CI
on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: pytest -q
      - run: pip-audit -r backend/requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Frontend types must match the API
        run: |
          python scripts/export_openapi.py
          cd frontend && npm run gen:api && git diff --exit-code openapi.json src/api/schema.d.ts
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stocksage .
      - name: The image serves the UI and the API
        run: |
          docker run -d --name s -p 8080:80 -e STOCKSAGE_BACKGROUND=0 stocksage
          for i in $(seq 30); do curl -fs localhost:8080/health && break; sleep 2; done
          curl -fs "localhost:8080/api/status?market=india" | grep -q '"market":"india"'
          curl -fs localhost:8080/stock/TCS.NS | grep -q 'id="root"'
