services:
  - type: web
    name: stocksage-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL # a Postgres URL (e.g. Neon). Without it history is lost on every restart.
        sync: false
      - key: GROQ_API_KEY
        sync: false
